name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o tv-project.zip -d proj
      - name: Fond d'ecran (optionnel)
        run: |
          for f in wallpaper.*; do
            if [ -f "$f" ]; then
              mkdir -p proj/app/src/main/assets
              cp "$f" proj/app/src/main/assets/wallpaper.img
            fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: cd proj && gradle assembleDebug --no-daemon
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v${{ github.run_number }} proj/app/build/outputs/apk/debug/app-debug.apk --title "PURE TV GLASS v${{ github.run_number }}" --notes "APK a installer sur la tele"
